<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" fill="none" role="img" aria-label="Enterprise IT Infrastructure and Network Security Architecture">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="720" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2F7FC" />
      <stop offset="100%" stop-color="#E5EEFF" />
    </linearGradient>
    <linearGradient id="navyCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#203F5F" />
      <stop offset="100%" stop-color="#032948" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3979C7" />
      <stop offset="100%" stop-color="#50B5E5" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#203F5F" flood-opacity="0.09" />
    </filter>
  </defs>

  <rect width="720" height="540" rx="24" fill="url(#bgSky)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#D2E4FF" stroke-width="1" opacity="0.7">
    <line x1="80" y1="0" x2="80" y2="540" />
    <line x1="200" y1="0" x2="200" y2="540" />
    <line x1="320" y1="0" x2="320" y2="540" />
    <line x1="440" y1="0" x2="440" y2="540" />
    <line x1="560" y1="0" x2="560" y2="540" />
    <line x1="0" y1="108" x2="720" y2="108" />
    <line x1="0" y1="216" x2="720" y2="216" />
    <line x1="0" y1="324" x2="720" y2="324" />
    <line x1="0" y1="432" x2="720" y2="432" />
  </g>

  <!-- Main Enterprise Command Window -->
  <g filter="url(#softShadow)">
    <rect x="64" y="64" width="540" height="360" rx="18" fill="#FFFFFF" stroke="#E2EBF5" stroke-width="1.5" />
    <!-- Top Window Bar -->
    <rect x="64" y="64" width="540" height="52" rx="18" fill="#F8FAFF" />
    <rect x="64" y="100" width="540" height="16" fill="#F8FAFF" />
    <line x1="64" y1="116" x2="604" y2="116" stroke="#E2EBF5" stroke-width="1" />
    <circle cx="94" cy="90" r="6" fill="#3979C7" />
    <circle cx="114" cy="90" r="6" fill="#50B5E5" />
    <circle cx="134" cy="90" r="6" fill="#D2E4FF" />
    <rect x="162" y="82" width="170" height="16" rx="4" fill="#E8F2FB" />
    <rect x="468" y="80" width="112" height="20" rx="6" fill="#203F5F" />
    <text x="524" y="94" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="10" font-weight="600">NOC ACTIVE</text>

    <!-- Left Server Rack Module -->
    <rect x="92" y="140" width="210" height="252" rx="12" fill="url(#navyCard)" />
    <text x="112" y="168" fill="#78D1FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">CORE INFRASTRUCTURE</text>
    <!-- Rack Units -->
    <rect x="112" y="186" width="170" height="36" rx="6" fill="#173350" stroke="#31577E" stroke-width="1" />
    <rect x="124" y="198" width="60" height="6" rx="3" fill="#50B5E5" />
    <rect x="124" y="208" width="94" height="4" rx="2" fill="#8DABD0" opacity="0.7" />
    <circle cx="264" cy="204" r="5" fill="#50B5E5" />

    <rect x="112" y="234" width="170" height="36" rx="6" fill="#173350" stroke="#31577E" stroke-width="1" />
    <rect x="124" y="246" width="76" height="6" rx="3" fill="#3979C7" />
    <rect x="124" y="256" width="108" height="4" rx="2" fill="#8DABD0" opacity="0.7" />
    <circle cx="264" cy="252" r="5" fill="#78D1FF" />

    <rect x="112" y="282" width="170" height="36" rx="6" fill="#173350" stroke="#31577E" stroke-width="1" />
    <rect x="124" y="294" width="52" height="6" rx="3" fill="#50B5E5" />
    <rect x="124" y="304" width="88" height="4" rx="2" fill="#8DABD0" opacity="0.7" />
    <circle cx="264" cy="300" r="5" fill="#50B5E5" />

    <rect x="112" y="334" width="170" height="38" rx="8" fill="#3979C7" opacity="0.25" stroke="#50B5E5" stroke-width="1" />
    <text x="126" y="357" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">99.98% SLA Uptime</text>

    <!-- Right Topology & Analytics Area -->
    <rect x="322" y="140" width="258" height="122" rx="12" fill="#F2F7FC" stroke="#E2EBF5" stroke-width="1" />
    <text x="340" y="164" fill="#203F5F" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Network Throughput</text>
    <text x="562" y="164" text-anchor="end" fill="#3979C7" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">+38.4%</text>
    <!-- Chart Bars -->
    <rect x="344" y="218" width="18" height="28" rx="4" fill="#C8DBFA" />
    <rect x="372" y="206" width="18" height="40" rx="4" fill="#A6C8FF" />
    <rect x="400" y="196" width="18" height="50" rx="4" fill="#72ADFF" />
    <rect x="428" y="210" width="18" height="36" rx="4" fill="#A6C8FF" />
    <rect x="456" y="186" width="18" height="60" rx="4" fill="#3979C7" />
    <rect x="484" y="192" width="18" height="54" rx="4" fill="#50B5E5" />
    <rect x="512" y="176" width="18" height="70" rx="4" fill="#203F5F" />
    <rect x="540" y="182" width="18" height="64" rx="4" fill="#3979C7" />

    <!-- Bottom Right Security Shield Module -->
    <rect x="322" y="278" width="258" height="114" rx="12" fill="#FFFFFF" stroke="#E2EBF5" stroke-width="1" />
    <rect x="340" y="298" width="44" height="44" rx="10" fill="#E8F2FB" />
    <path d="M362 308L374 313V322C374 329.2 368.8 335.7 362 337.5C355.2 335.7 350 329.2 350 322V313L362 308Z" stroke="#203F5F" stroke-width="2" fill="#50B5E5" fill-opacity="0.25" />
    <path d="M357.5 321.5L360.8 324.8L367 318.5" stroke="#203F5F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="398" y="316" fill="#172B42" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Zero-Trust Shield</text>
    <text x="398" y="335" fill="#66788A" font-family="Inter, sans-serif" font-size="11.5">24/7 Managed Firewall &amp; EDR</text>
    <rect x="340" y="356" width="222" height="16" rx="8" fill="#F2F7FC" />
    <rect x="340" y="356" width="188" height="16" rx="8" fill="url(#blueAccent)" />
  </g>

  <!-- Floating Secondary Card Bottom-Right -->
  <g filter="url(#softShadow)">
    <rect x="448" y="388" width="224" height="108" rx="14" fill="#FFFFFF" stroke="#E2EBF5" stroke-width="1.5" />
    <rect x="468" y="408" width="36" height="36" rx="9" fill="#203F5F" />
    <path d="M480 426H492M486 420V432" stroke="#50B5E5" stroke-width="2.2" stroke-linecap="round" />
    <text x="516" y="423" fill="#172B42" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Global Rollouts</text>
    <text x="516" y="440" fill="#66788A" font-family="Inter, sans-serif" font-size="11">Cisco, Data Center &amp; Cloud</text>
    <rect x="468" y="460" width="184" height="16" rx="4" fill="#E8F2FB" />
    <text x="476" y="472" fill="#203F5F" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">22 SPECIALIZED SERVICES</text>
  </g>
</svg>
